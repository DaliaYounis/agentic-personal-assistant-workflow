<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Personal Assistant</title>
  <desc id="desc">PDF upload is separate from chat. Each message goes to one assistant. Pinecone returns similarity scores, and the server either answers from those chunks or offers web and image search.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card">
      <rect width="1440" height="520" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="520" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>

    <text x="56" y="118" fill="#f8fafc" font-size="46" font-weight="700">Agentic Personal</text>
    <text x="56" y="174" fill="#f8fafc" font-size="46" font-weight="700">Assistant</text>
    <text x="56" y="226" fill="#94a3b8" font-size="18">PDF upload is separate from the conversation.</text>
    <text x="56" y="252" fill="#94a3b8" font-size="18">Chat answers from chunks, or from search.</text>

    <rect x="56" y="286" width="196" height="42" rx="21" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="154" y="313" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">TOOL CALLING</text>
    <rect x="264" y="286" width="96" height="42" rx="21" fill="none" stroke="#4ade80" stroke-width="1.5"/>
    <text x="312" y="313" text-anchor="middle" fill="#86efac" font-size="14" font-weight="700">RAG</text>
    <rect x="372" y="286" width="96" height="42" rx="21" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="420" y="313" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700">MCP</text>

    <rect x="56" y="342" width="132" height="42" rx="21" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="122" y="369" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">PINECONE</text>
    <rect x="200" y="342" width="132" height="42" rx="21" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="266" y="369" text-anchor="middle" fill="#fda4af" font-size="14" font-weight="700">SERPAPI</text>
    <rect x="344" y="342" width="128" height="42" rx="21" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="408" y="369" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">MEMORY</text>

    <text x="56" y="440" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="1.6">AI ENGINEER CASE STUDY</text>

    <rect x="860" y="36" width="500" height="70" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="1110" y="66" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Client</text>
    <text x="1110" y="88" text-anchor="middle" fill="#94a3b8" font-size="15">Chat, and a separate PDF library</text>
    <line x1="1110" y1="106" x2="1110" y2="128" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="860" y="132" width="500" height="78" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="1110" y="164" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Retrieve first</text>
    <text x="1110" y="188" text-anchor="middle" fill="#c4b5fd" font-size="15">Pinecone returns scores. The server picks the path</text>

    <line x1="1110" y1="210" x2="1110" y2="236" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="960" y1="236" x2="1260" y2="236" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="960" y1="236" x2="960" y2="258" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1260" y1="236" x2="1260" y2="258" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="820" y="262" width="280" height="150" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="960" y="304" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Documents</text>
    <text x="960" y="332" text-anchor="middle" fill="#67e8f9" font-size="14">Chunks in the prompt</text>
    <text x="960" y="356" text-anchor="middle" fill="#64748b" font-size="13">Tools stay unbound</text>
    <text x="960" y="380" text-anchor="middle" fill="#64748b" font-size="13">Answer from the PDF</text>

    <rect x="1120" y="262" width="280" height="150" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="1260" y="304" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Search tools</text>
    <text x="1260" y="332" text-anchor="middle" fill="#6ee7b7" font-size="14">web_search or image_search</text>
    <text x="1260" y="356" text-anchor="middle" fill="#64748b" font-size="13">MCP, then SerpAPI</text>
    <text x="1260" y="380" text-anchor="middle" fill="#64748b" font-size="13">Or a direct reply</text>

    <text x="1110" y="458" text-anchor="middle" fill="#94a3b8" font-size="16">One assistant. A relevant chunk closes search.</text>
  </g>
</svg>

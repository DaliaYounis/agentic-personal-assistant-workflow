<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">RAG pipeline</title>
  <desc id="desc">A PDF is uploaded on its own request, then split and embedded into Pinecone. Later chat questions retrieve chunks. The server uses the scores to decide whether search tools are offered.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card"><rect width="1440" height="640" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="640" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>

    <text x="48" y="48" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="1.1">INDEX ONCE - POST /api/ingest</text>

    <rect x="28" y="68" width="200" height="120" rx="16" fill="#10213b" stroke="#38bdf8" stroke-width="2"/>
    <text x="128" y="112" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">PDF upload</text>
    <text x="128" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">25 MB, PDF only</text>
    <line x1="228" y1="128" x2="252" y2="128" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="256" y="68" width="200" height="120" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="356" y="112" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Temp file</text>
    <text x="356" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">OS temp, then deleted</text>
    <line x1="456" y1="128" x2="480" y2="128" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="484" y="68" width="200" height="120" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="584" y="112" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Load</text>
    <text x="584" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">PDFLoader pages</text>
    <line x1="684" y1="128" x2="708" y2="128" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="712" y="68" width="210" height="120" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="817" y="112" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Chunk</text>
    <text x="817" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">1000 chars, overlap 200</text>
    <line x1="922" y1="128" x2="946" y2="128" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="950" y="68" width="220" height="120" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="1060" y="104" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Embed</text>
    <text x="1060" y="132" text-anchor="middle" fill="#94a3b8" font-size="13">llama-text-embed-v2</text>
    <text x="1060" y="156" text-anchor="middle" fill="#94a3b8" font-size="13">Batches of 96</text>
    <line x1="1170" y1="128" x2="1194" y2="128" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1198" y="68" width="214" height="120" rx="16" fill="#10213b" stroke="#22d3ee" stroke-width="2"/>
    <text x="1305" y="112" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Pinecone</text>
    <text x="1305" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">One shared index</text>

    <text x="48" y="236" fill="#fcd34d" font-size="15" font-weight="700" letter-spacing="1.1">EVERY QUESTION - findRelevantChunks</text>

    <rect x="28" y="256" width="250" height="128" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
    <text x="153" y="300" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Query</text>
    <text x="153" y="328" text-anchor="middle" fill="#94a3b8" font-size="14">Two prior user turns</text>
    <text x="153" y="352" text-anchor="middle" fill="#94a3b8" font-size="14">plus this message</text>
    <line x1="278" y1="320" x2="312" y2="320" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="316" y="256" width="250" height="128" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="441" y="300" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Candidates</text>
    <text x="441" y="328" text-anchor="middle" fill="#94a3b8" font-size="14">Similarity search</text>
    <text x="441" y="352" text-anchor="middle" fill="#94a3b8" font-size="14">Top 8 with scores</text>
    <line x1="566" y1="320" x2="600" y2="320" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="604" y="256" width="270" height="128" rx="16" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <text x="739" y="300" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Filter</text>
    <text x="739" y="328" text-anchor="middle" fill="#94a3b8" font-size="14">Drop score below 0.3</text>
    <text x="739" y="352" text-anchor="middle" fill="#94a3b8" font-size="14">Drop duplicate text</text>
    <line x1="874" y1="320" x2="908" y2="320" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="912" y="256" width="500" height="128" rx="16" fill="#10213b" stroke="#34d399" stroke-width="2"/>
    <text x="1162" y="300" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Up to 4 chunks</text>
    <text x="1162" y="332" text-anchor="middle" fill="#94a3b8" font-size="14">Found: inject into the system prompt</text>
    <text x="1162" y="356" text-anchor="middle" fill="#94a3b8" font-size="14">None: the server offers MCP search tools</text>

    <text x="48" y="440" fill="#94a3b8" font-size="16">Upload is a separate request. It does not add a turn to the conversation.</text>
    <text x="48" y="478" fill="#94a3b8" font-size="16">New files append to one index. Nothing in this API deletes old chunks.</text>
    <text x="48" y="516" fill="#94a3b8" font-size="16">Retrieval runs in the server before the model sees the turn.</text>
    <text x="48" y="574" fill="#64748b" font-size="15">Sample file in the repo: AlgoArabTech.pdf. It is indexed only after someone uploads it.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Tool-calling loop</title>
  <desc id="desc">The assistant invokes the model up to six times. Each tool call is executed and appended before the next invoke. A response with no tool calls ends the turn.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.4 9 5 0 8.6Z" fill="#7dd3fc"/>
    </marker>
    <clipPath id="card"><rect width="1440" height="560" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="560" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>

    <text x="48" y="52" fill="#c4b5fd" font-size="15" font-weight="700" letter-spacing="1.1">runAssistant - MAX_TOOL_STEPS = 6</text>

    <rect x="36" y="80" width="300" height="200" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="186" y="124" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">MESSAGES</text>
    <text x="186" y="160" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Prompt stack</text>
    <text x="186" y="194" text-anchor="middle" fill="#94a3b8" font-size="15">System prompt</text>
    <text x="186" y="220" text-anchor="middle" fill="#94a3b8" font-size="15">History as chat messages</text>
    <text x="186" y="246" text-anchor="middle" fill="#94a3b8" font-size="15">This user message</text>

    <line x1="336" y1="180" x2="388" y2="180" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="392" y="80" width="300" height="200" rx="16" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
    <text x="542" y="124" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">INVOKE</text>
    <text x="542" y="160" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">gpt-4o</text>
    <text x="542" y="194" text-anchor="middle" fill="#94a3b8" font-size="15">Tools bound only when</text>
    <text x="542" y="220" text-anchor="middle" fill="#94a3b8" font-size="15">the list is non-empty</text>
    <text x="542" y="246" text-anchor="middle" fill="#64748b" font-size="14">Response is appended</text>

    <line x1="692" y1="180" x2="744" y2="180" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="748" y="80" width="320" height="200" rx="16" fill="#10213b" stroke="#fbbf24" stroke-width="2"/>
    <text x="908" y="124" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">TOOL CALLS?</text>
    <text x="908" y="164" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Branch</text>
    <text x="908" y="202" text-anchor="middle" fill="#94a3b8" font-size="15">None: return the text</text>
    <text x="908" y="230" text-anchor="middle" fill="#94a3b8" font-size="15">Some: run every call</text>
    <text x="908" y="254" text-anchor="middle" fill="#64748b" font-size="14">Then invoke again</text>

    <line x1="1068" y1="180" x2="1120" y2="180" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1124" y="80" width="280" height="200" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
    <text x="1264" y="124" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">TOOL MESSAGE</text>
    <text x="1264" y="164" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Result text</text>
    <text x="1264" y="202" text-anchor="middle" fill="#94a3b8" font-size="15">Missing tool: a note</text>
    <text x="1264" y="228" text-anchor="middle" fill="#94a3b8" font-size="15">Thrown error: the message</text>
    <text x="1264" y="254" text-anchor="middle" fill="#64748b" font-size="14">Model can answer next</text>

    <rect x="36" y="330" width="680" height="180" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/>
    <text x="376" y="374" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">STOP</text>
    <text x="376" y="414" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Text goes back as answer</text>
    <text x="376" y="452" text-anchor="middle" fill="#94a3b8" font-size="15">Empty model text becomes a short fallback in the controller</text>
    <text x="376" y="480" text-anchor="middle" fill="#94a3b8" font-size="15">String content, or joined text parts, is what the client shows</text>

    <rect x="740" y="330" width="664" height="180" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
    <text x="1072" y="374" text-anchor="middle" fill="#fda4af" font-size="14" font-weight="700">SIX STEPS USED</text>
    <text x="1072" y="414" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">The loop gives up</text>
    <text x="1072" y="452" text-anchor="middle" fill="#94a3b8" font-size="15">I could not finish that request.</text>
    <text x="1072" y="480" text-anchor="middle" fill="#94a3b8" font-size="15">The user is asked to be more specific</text>
  </g>
</svg>

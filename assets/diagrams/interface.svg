<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Chat interface</title>
  <desc id="desc">The React page is a sidebar for PDF upload and a conversation panel. Assistant replies are rendered as markdown.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.42" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="card"><rect width="1440" height="640" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="1440" height="640" fill="#070d18"/>
    <rect width="1440" height="6" fill="url(#bar)"/>

    <rect x="48" y="40" width="1344" height="560" rx="20" fill="#f6f5f3"/>
    <rect x="48" y="40" width="360" height="560" fill="#fffcf8"/>
    <line x1="408" y1="40" x2="408" y2="600" stroke="#e7e5e4" stroke-width="2"/>

    <rect x="80" y="72" width="36" height="36" rx="10" fill="#1c1917"/>
    <text x="98" y="96" text-anchor="middle" fill="#fafaf9" font-size="16" font-weight="700">A</text>
    <text x="128" y="86" fill="#1c1917" font-size="15" font-weight="700">Personal Assistant</text>
    <text x="128" y="108" fill="#78716c" font-size="12">PDF library, separate</text>
    <text x="128" y="126" fill="#78716c" font-size="12">from the conversation.</text>

    <text x="80" y="190" fill="#78716c" font-size="12" font-weight="700" letter-spacing="1">LIBRARY</text>
    <text x="80" y="220" fill="#1c1917" font-size="22" font-weight="700">Documents</text>
    <text x="80" y="250" fill="#78716c" font-size="13">Add a PDF. Questions about it</text>
    <text x="80" y="270" fill="#78716c" font-size="13">are answered from that file.</text>

    <rect x="80" y="300" width="296" height="72" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
    <text x="100" y="330" fill="#1c1917" font-size="14" font-weight="600">Choose a PDF</text>
    <text x="100" y="352" fill="#78716c" font-size="12">PDF only, up to 25 MB</text>

    <rect x="80" y="388" width="296" height="44" rx="10" fill="#1c1917"/>
    <text x="228" y="416" text-anchor="middle" fill="#fafaf9" font-size="14" font-weight="600">Add document</text>
    <text x="80" y="460" fill="#78716c" font-size="13">Success copy: Document added.</text>

    <text x="440" y="78" fill="#78716c" font-size="12" font-weight="700" letter-spacing="1">CONVERSATION</text>
    <text x="440" y="112" fill="#1c1917" font-size="28" font-weight="700">Assistant</text>
    <circle cx="1288" cy="96" r="6" fill="#16a34a"/>
    <text x="1304" y="102" fill="#44403c" font-size="14">Ready</text>

    <text x="440" y="180" fill="#78716c" font-size="12" font-weight="700" letter-spacing="1">START HERE</text>
    <text x="440" y="214" fill="#1c1917" font-size="22" font-weight="700">Ask about a document or something current.</text>
    <text x="440" y="246" fill="#57534e" font-size="15">Upload a PDF, then ask in the same conversation you use for the web.</text>

    <rect x="440" y="290" width="520" height="88" rx="14" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="460" y="318" fill="#78716c" font-size="12" font-weight="700">YOU</text>
    <text x="460" y="348" fill="#1c1917" font-size="15">What is AlgoArabTech?</text>

    <rect x="440" y="394" width="900" height="100" rx="14" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="460" y="422" fill="#78716c" font-size="12" font-weight="700">ASSISTANT</text>
    <text x="460" y="452" fill="#1c1917" font-size="15">Markdown answer. Image tags from image_search render here.</text>
    <text x="460" y="476" fill="#78716c" font-size="13">While waiting, three dots replace the reply. Status reads Thinking.</text>

    <rect x="440" y="520" width="780" height="52" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="460" y="552" fill="#a8a29e" font-size="14">Ask about your documents or the web</text>
    <rect x="1240" y="528" width="100" height="36" rx="8" fill="#1c1917"/>
    <text x="1290" y="552" text-anchor="middle" fill="#fafaf9" font-size="14" font-weight="600">Send</text>
  </g>
</svg>
